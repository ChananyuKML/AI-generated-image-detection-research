<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="diagramTitle diagramDesc"><title id="diagramTitle">Inside the KC projection and inhibition</title><desc id="diagramDesc">Diagram of the current KCNet-inspired CNN model. Fixed gradient filters, variant-dependent CNN training, fixed sparse summation and inhibition, and learned binary readout. Tensor dimensions follow networks/kcnet.py.</desc><rect width="1920" height="1080" fill="white"/><defs><marker id="arrow0" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#68727d"/></marker><marker id="arrow1" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#19766f"/></marker></defs><rect x="70" y="183" width="290" height="476" fill="#ffffff" stroke="#bac1c7" stroke-width="2"/><ellipse cx="252" cy="269" rx="15" ry="15" fill="#e0f1ec" stroke="#19766f" stroke-width="2"/><ellipse cx="252" cy="312" rx="15" ry="15" fill="#e0f1ec" stroke="#19766f" stroke-width="2"/><ellipse cx="252" cy="355" rx="15" ry="15" fill="#f2f3f4" stroke="#bac1c7" stroke-width="2"/><ellipse cx="252" cy="398" rx="15" ry="15" fill="#e0f1ec" stroke="#19766f" stroke-width="2"/><ellipse cx="252" cy="441" rx="15" ry="15" fill="#e0f1ec" stroke="#19766f" stroke-width="2"/><ellipse cx="252" cy="484" rx="15" ry="15" fill="#e0f1ec" stroke="#19766f" stroke-width="2"/><ellipse cx="252" cy="527" rx="15" ry="15" fill="#e0f1ec" stroke="#19766f" stroke-width="2"/><ellipse cx="252" cy="570" rx="15" ry="15" fill="#f2f3f4" stroke="#bac1c7" stroke-width="2"/><ellipse cx="252" cy="613" rx="15" ry="15" fill="#e0f1ec" stroke="#19766f" stroke-width="2"/><ellipse cx="625" cy="432" rx="75" ry="75" fill="#f2f3f4" stroke="#bac1c7" stroke-width="2"/><rect x="780" y="385" width="170" height="94" fill="#f2f3f4" stroke="#bac1c7" stroke-width="2"/><rect x="1040" y="362" width="290" height="142" fill="#f2f3f4" stroke="#bac1c7" stroke-width="2"/><rect x="1430" y="345" width="410" height="175" fill="#f2f3f4" stroke="#bac1c7" stroke-width="2"/><rect x="70" y="785" width="190" height="40" fill="#3d444d" stroke="#bac1c7" stroke-width="1"/><rect x="260" y="785" width="190" height="40" fill="#3d444d" stroke="#bac1c7" stroke-width="1"/><rect x="450" y="785" width="200" height="40" fill="#3d444d" stroke="#bac1c7" stroke-width="1"/><rect x="650" y="785" width="210" height="40" fill="#3d444d" stroke="#bac1c7" stroke-width="1"/><rect x="70" y="825" width="190" height="43" fill="#f2f3f4" stroke="#bac1c7" stroke-width="1"/><rect x="260" y="825" width="190" height="43" fill="#ffffff" stroke="#bac1c7" stroke-width="1"/><rect x="450" y="825" width="200" height="43" fill="#ffffff" stroke="#bac1c7" stroke-width="1"/><rect x="650" y="825" width="210" height="43" fill="#ffffff" stroke="#bac1c7" stroke-width="1"/><rect x="70" y="868" width="190" height="43" fill="#f2f3f4" stroke="#bac1c7" stroke-width="1"/><rect x="260" y="868" width="190" height="43" fill="#ffffff" stroke="#bac1c7" stroke-width="1"/><rect x="450" y="868" width="200" height="43" fill="#ffffff" stroke="#bac1c7" stroke-width="1"/><rect x="650" y="868" width="210" height="43" fill="#ffffff" stroke="#bac1c7" stroke-width="1"/><rect x="70" y="911" width="190" height="43" fill="#f2f3f4" stroke="#bac1c7" stroke-width="1"/><rect x="260" y="911" width="190" height="43" fill="#ffffff" stroke="#bac1c7" stroke-width="1"/><rect x="450" y="911" width="200" height="43" fill="#ffffff" stroke="#bac1c7" stroke-width="1"/><rect x="650" y="911" width="210" height="43" fill="#ffffff" stroke="#bac1c7" stroke-width="1"/><rect x="990" y="803" width="165" height="92" fill="#fff0d0" stroke="#bac1c7" stroke-width="2"/><rect x="1195" y="803" width="200" height="92" fill="#f2f3f4" stroke="#bac1c7" stroke-width="2"/><rect x="1435" y="803" width="185" height="92" fill="#e0f1ec" stroke="#bac1c7" stroke-width="2"/><rect x="1660" y="803" width="165" height="92" fill="#f2f3f4" stroke="#bac1c7" stroke-width="2"/><path d="M267,269 L550,432" fill="none" stroke="#68727d" stroke-width="2"/><path d="M267,312 L550,432" fill="none" stroke="#68727d" stroke-width="2"/><path d="M267,398 L550,432" fill="none" stroke="#68727d" stroke-width="2"/><path d="M267,441 L550,432" fill="none" stroke="#68727d" stroke-width="2"/><path d="M267,484 L550,432" fill="none" stroke="#68727d" stroke-width="2"/><path d="M267,527 L550,432" fill="none" stroke="#68727d" stroke-width="2"/><path d="M267,613 L550,432" fill="none" stroke="#68727d" stroke-width="2"/><path d="M700,432 L780,432" fill="none" stroke="#68727d" stroke-width="2.5" marker-end="url(#arrow0)"/><path d="M950,432 L1040,433" fill="none" stroke="#68727d" stroke-width="2.5" marker-end="url(#arrow0)"/><path d="M1330,433 L1430,432.5" fill="none" stroke="#68727d" stroke-width="2.5" marker-end="url(#arrow0)"/><path d="M1660,849 L1620,849" fill="none" stroke="#19766f" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow1)"/><path d="M1435,849 L1395,849" fill="none" stroke="#19766f" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow1)"/><path d="M1195,849 L1155,849" fill="none" stroke="#19766f" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow1)"/><text x="70" y="81.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" text-anchor="start">Inside the KC projection and inhibition</text><text x="70" y="132.5" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start">Seven fixed feature connections per unit, followed by per-image mean inhibition</text><text x="215" y="218.16" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Normalized CNN</text><text x="215" y="244.16" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">features u</text><text x="221" y="273.82" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="end">u[3]</text><text x="221" y="316.82" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="end">u[18]</text><text x="221" y="359.82" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="end">u[50]</text><text x="221" y="402.82" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="end">u[207]</text><text x="221" y="445.82" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="end">u[511]</text><text x="221" y="488.82" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="end">u[900]</text><text x="221" y="531.82" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="end">u[1200]</text><text x="221" y="574.82" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="end">u[1400]</text><text x="221" y="617.82" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="end">u[1984]</text><text x="215" y="640.8" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">2,048 entries; 9 shown</text><text x="610" y="233.5" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle">7 distinct selected indices</text><text x="610" y="260.14" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle">All selected coefficients are +1</text><text x="625" y="324.16" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">One illustrative unit j</text><text x="625" y="427.18" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" text-anchor="middle">Σ</text><text x="625" y="461.64" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle">KC unit j</text><text x="865" y="426.88" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="middle">rⱼ</text><text x="865" y="454.46" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">One raw response</text><text x="696.5" y="578.16" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="middle">rⱼ = sum of the 7 selected u[i]</text><text x="696.5" y="606.8" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Illustrative indices, not a saved run trace</text><text x="1187" y="309.16" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Repeat for all 4,096 units</text><text x="1187" y="335.8" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Each unit has its own fixed index set</text><text x="1185" y="407.5" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Raw response vector r</text><text x="1185" y="441.5" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="middle">r₀, r₁, …, r₄₀₉₅</text><text x="1185" y="474.82" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">4,096 values</text><text x="1635" y="390" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Mean inhibition + ReLU</text><text x="1635" y="423.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">μ = mean(r) for this image</text><text x="1635" y="457.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">zⱼ = max(0, rⱼ − μ)</text><text x="1635" y="491.66" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="middle">Output z: 4,096 activities</text><text x="1635" y="589.48" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">The active fraction varies with the image.</text><text x="1635" y="619.48" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">No fixed top-k or 5% rule.</text><text x="70" y="749.18" fill="#19766f" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start">Illustration: 3 units, mean = 0.50</text><text x="165" y="812.82" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Unit</text><text x="355" y="812.82" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Raw r</text><text x="550" y="812.82" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">r − mean</text><text x="755" y="812.82" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">After ReLU</text><text x="165" y="854.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">A</text><text x="355" y="854.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">0.20</text><text x="550" y="854.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">−0.30</text><text x="755" y="854.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">0</text><text x="165" y="897.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">B</text><text x="355" y="897.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">0.50</text><text x="550" y="897.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">0.00</text><text x="755" y="897.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">0</text><text x="165" y="940.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">C</text><text x="355" y="940.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">0.80</text><text x="550" y="940.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">0.30</text><text x="755" y="940.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">0.30</text><text x="70" y="1008.14" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Example only. The actual head contains 4,096 units.</text><text x="980" y="749.18" fill="#19766f" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start">Fine-tuning: gradients pass through the fixed head</text><text x="1072.5" y="843.66" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">CNN</text><text x="1072.5" y="869.64" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle">Updated</text><text x="1295" y="833.14" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Fixed KC head</text><text x="1295" y="855.12" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">ReLU / mean / sum</text><text x="1295" y="878.12" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">L2 / pool</text><text x="1527.5" y="843.66" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Readout</text><text x="1527.5" y="869.64" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle">Updated</text><text x="1742.5" y="843.66" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">BCE loss</text><text x="1742.5" y="868.96" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">On the logit</text><text x="990" y="960.48" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Frozen KC: the encoder runs without gradient recording.</text><text x="990" y="992.48" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Only the readout parameters train.</text></svg>