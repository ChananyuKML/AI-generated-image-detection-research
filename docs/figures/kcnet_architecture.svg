 L640,282.5" fill="none" stroke="#68727d" stroke-width="2.5" marker-end="url(#arrow0)"/><path d="M1090,282.5 L1130,282.5" fill="none" stroke="#68727d" stroke-width="2.5" marker-end="url(#arrow0)"/><path d="M1460,282.5 L1500,282.5" fill="none" stroke="#68727d" stroke-width="2.5" marker-end="url(#arrow0)"/><path d="M1675,395 L1675,442 L35,442 L35,645 L70,645" fill="none" stroke="#68727d" stroke-width="2.5" marker-end="url(#arrow0)"/><path d="M470,645 L540,645" fill="none" stroke="#68727d" stroke-width="2.5" marker-end="url(#arrow0)"/><path d="M910,645 L980,645" fill="none" stroke="#68727d" stroke-width="2.5" marker-end="url(#arrow0)"/><path d="M1360,645 L1430,645" fill="none" stroke="#68727d" stroke-width="2.5" marker-end="url(#arrow0)"/><path d="M1170,750 L1170,782" fill="none" stroke="#68727d" stroke-width="2" marker-end="url(#arrow0)"/><text x="70" y="81.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" text-anchor="start">KCNet-inspired binary image detector</text><text x="70" y="132.5" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start">Full pipeline with tensor sizes per image (batch dimension omitted)</text><text x="1312" y="63.8" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Fixed or no learned parameters</text><text x="1312" y="92.8" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">CNN trainability depends on variant</text><text x="1312" y="121.8" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Trainable binary readout</text><text x="170" y="237.34" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle">1  Image</text><text x="170" y="272.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">Grayscale</text><text x="170" y="309.68" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" text-anchor="middle">224 × 224</text><text x="170" y="344.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">1 input channel</text><text x="450" y="223" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle">2  Fixed gradients</text><text x="450" y="256.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">Magnitude + angle</text><text x="450" y="290.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">atan2(Gy, Gx)</text><text x="450" y="324.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">Per-channel min/max</text><text x="450" y="359" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="middle">2 × 224 × 224</text><text x="865" y="212.84" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle">3  CNN encoder</text><text x="865" y="244.8" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">3×3 conv + ReLU + 2×2 max pool</text><text x="720" y="302.98" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Conv: 32</text><text x="720" y="332.62" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">32×112×112</text><text x="865" y="302.98" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Conv: 64</text><text x="865" y="332.62" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">64×56×56</text><text x="1010" y="302.98" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Conv: 128</text><text x="1010" y="332.62" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">128×28×28</text><text x="865" y="384.12" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Same pretrained encoder for both variants</text><text x="1295" y="223.34" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle">4  Pool + flatten</text><text x="1295" y="256.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">Adaptive average pool</text><text x="1295" y="290.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">128 × 4 × 4</text><text x="1295" y="324.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">Flatten spatial cells</text><text x="1295" y="359.34" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" text-anchor="middle">2,048 features</text><text x="1675" y="223.34" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle">5  L2 normalization</text><text x="1675" y="256.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">Per-image feature vector</text><text x="1675" y="290.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">u = x / max(||x||₂, ε)</text><text x="1675" y="324.32" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">ε = 10⁻⁸</text><text x="1675" y="359.34" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" text-anchor="middle">2,048 features</text><text x="70" y="515.2" fill="#19766f" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start">KC classifier head</text><text x="270" y="589.5" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle">6  Fixed sparse projection</text><text x="270" y="620.82" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">4,096 units; 7 inputs per unit</text><text x="270" y="652.82" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">Selected coefficients are +1</text><text x="270" y="684.82" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">Indices stay fixed (seed 42)</text><text x="270" y="717.5" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="middle">4,096 raw responses</text><text x="725" y="589.5" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle">7  Inhibition + ReLU</text><text x="725" y="620.82" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">μ = mean of 4,096 responses</text><text x="725" y="652.82" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">zⱼ = max(0, rⱼ − μ)</text><text x="725" y="684.82" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">Mean computed per image</text><text x="725" y="717.5" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="middle">4,096 activities</text><text x="1170" y="587.84" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle">8  Linear readout</text><text x="1170" y="619.82" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">Linear(4,096, 1)</text><text x="1170" y="652.82" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">4,096 weights + 1 bias</text><text x="1170" y="685.82" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">Learned from binary labels</text><text x="1170" y="720.18" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" text-anchor="middle">One logit ℓ</text><text x="1640" y="587.84" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle">9  Inference</text><text x="1640" y="619.82" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">p_AI = sigmoid(ℓ)</text><text x="1640" y="652.82" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">AI if p_AI &gt; 0.5</text><text x="1640" y="685.82" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">Real otherwise</text><text x="1640" y="717.8" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">No additional learned parameters</text><text x="1170" y="807.64" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Training: BCEWithLogitsLoss</text><text x="1170" y="832.3" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Targets: nature = 0, ai = 1</text><text x="70" y="864.18" fill="#19766f" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start">Trainability after encoder pretraining</text><text x="380" y="906.48" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Component</text><text x="965" y="906.48" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Frozen CNN + KCNet</text><text x="1545" y="906.48" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Fine-tuned CNN + KCNet</text><text x="380" y="942.48" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">CNN encoder</text><text x="965" y="942.48" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">Frozen</text><text x="1545" y="942.48" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">Train</text><text x="380" y="976.48" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">Gradient kernels + KC connections</text><text x="965" y="976.48" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">Fixed</text><text x="1545" y="976.48" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">Fixed</text><text x="380" y="1010.48" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">Linear readout</text><text x="965" y="1010.48" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">Train</text><text x="1545" y="1010.48" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">Train</text><text x="380" y="1044.48" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">Trainable parameters</text><text x="965" y="1044.48" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">4,097</text><text x="1545" y="1044.48" fill="#191919" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">97,057</text></svg>