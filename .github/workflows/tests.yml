name: CPU tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up CPU environment
        run: python scripts/run.py setup --compute cpu
      - name: Run dataset-free unit tests
        run: python scripts/run.py test
      - name: Verify CPU train, resume, and evaluation
        run: .venv/bin/python tools/check_workflow.py --device cpu --models learned_filter_cnn
